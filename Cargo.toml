[package]
name = "retrieval-mcp"
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
description = "Context-efficient code retrieval over MCP: four tools chosen by measurement, no index files, no daemon, offline by default"
license = "MIT"
repository = "https://github.com/abendrothj/retrieval-mcp"
readme = "README.md"
keywords = ["mcp", "code-search", "retrieval", "llm", "agents"]
categories = ["development-tools", "command-line-utilities"]
# The Python harness, question sets and CI are the research record, not part of the crate a
# dependent builds. They stay in the repository and out of the published archive.
exclude = ["experiments/", ".github/"]

# `cargo binstall retrieval-mcp` downloads the release archive built by `.github/workflows/
# release.yml` instead of compiling the Tree-sitter grammars. The shapes here are the real v0.1.4
# asset names: `retrieval-mcp-v0.1.4-aarch64-apple-darwin.tar.gz`, containing
# `retrieval-mcp-v0.1.4-aarch64-apple-darwin/retrieval-mcp`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/retrieval-mcp-v{ version }-{ target }{ archive-suffix }"
bin-dir = "retrieval-mcp-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25"
tempfile = "3"
tree-sitter-typescript = "0.23.2"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
