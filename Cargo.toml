[package]
name = "retrieval-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Separate code retrieval tools for model-directed routing experiments"
license = "MIT"

[dependencies]
anyhow = "1"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tempfile = "3"
