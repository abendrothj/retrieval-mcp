# Prebuilt binaries for a tagged release. `cargo install retrieval-mcp` needs a Rust toolchain and
# two minutes of compiling Tree-sitter grammars; this is the path for people who have neither.
#
# Every target is built on its own native runner rather than cross-compiled, because the
# Tree-sitter grammars need a working C compiler for the target and a native runner is the one
# configuration that is certain to have it - and because the packaged binary is then executed on
# the machine that built it before anyone downloads it. Intel macOS uses `macos-15-intel`:
# `macos-13` was retired on 2025-12-04 and a job asking for it now queues forever, which is how
# v0.1.3's first release run sat unstarted for eight hours. That label is supported until
# August 2027; after it, this target either cross-compiles without an executed smoke test or goes
# the way of Windows below.
#
# Windows is deliberately absent: the server has Unix-specific paths (log-file mode 0600, process
# group handling in the tests) that have never been exercised there, and an untested binary is a
# claim this project does not get to make.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build binaries for
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Alpine and distroless images cannot run the glibc binaries, and a container is where
          # an MCP server most often lives. A musl build is static, so it runs on the glibc runner
          # that produced it and the packaged-binary smoke test below still executes for real.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Tree-sitter grammars are C, so a musl target needs a musl C compiler; `cc` looks for
      # it under this per-target variable before falling back to the host `cc`, which would link
      # the grammars against glibc and defeat the point.
      - name: musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_env="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --bin retrieval-mcp --target ${{ matrix.target }}

      # The binary is the whole artifact: no config file, no data directory, no index to ship.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="retrieval-mcp-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/retrieval-mcp" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          shasum -a 256 "dist/${name}.tar.gz" | sed "s| dist/| |" > "dist/${name}.tar.gz.sha256"

      # Proves the artifact runs on the machine that built it before anyone downloads it: one real
      # MCP handshake and one real tool call against this repository, exactly as the README shows.
      # Nothing is installed first - the binary has no runtime dependencies.
      - name: Smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          binary="dist/retrieval-mcp-${version}-${{ matrix.target }}/retrieval-mcp"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"find_callers","arguments":{"name":"build"}}}' \
            | "$binary" --root . 2>/dev/null | tail -1 > reply.json
          python3 - <<'PY'
          import json
          reply = json.load(open("reply.json"))
          rows = reply["result"]["structuredContent"]["results"]
          assert rows and all(row.get("caller") for row in rows), reply
          print(f"packaged binary answered with {len(rows)} caller rows")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-mcp-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      # Checked out only for the tag's own annotation, which becomes the release notes:
      # `gh release create --notes-from-tag` refuses to run together with `--repo`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One manifest covering every archive, generated here rather than in the matrix: parallel
      # runners cannot append to a single file without racing, and this job is the one place that
      # holds every archive at once. The per-archive `<name>.tar.gz.sha256` files
      # stay - they are already documented - and this adds the aggregate form `install.sh`
      # verifies against. `SHA256SUMS` is also the only asset whose name does not embed the tag,
      # so it can be fetched from `releases/latest/download/` and then name the archive to
      # download, which is how the installer resolves "latest" without an API call or a token.
      - name: Aggregate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum retrieval-mcp-*.tar.gz > SHA256SUMS
          lines="$(wc -l < SHA256SUMS)"
          # One record per matrix target: six today, and a matrix change that silently drops a
          # platform should fail the release rather than publish a short manifest.
          if [ "$lines" -ne 6 ]; then
            echo "expected one record per release target, got ${lines}:" >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          cat SHA256SUMS

      # `gh release upload` needs a release object, and a pushed tag does not create one: v0.1.2
      # and v0.1.3 were tagged with no release behind them, so the binaries had nowhere to go.
      - name: Publish the release and attach the binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          repository="${{ github.repository }}"
          if ! gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            git tag -l --format='%(contents)' "$tag" > release-notes.md
            gh release create "$tag" --repo "$repository" --title "$tag" --verify-tag \
              --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS \
            --clobber --repo "$repository"
          gh release view "$tag" --repo "$repository" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
